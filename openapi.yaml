openapi: 3.1.0
info:
  title: FitSheet Coach API
  version: 0.1.0
  description: Implemented backend API for AI coach-confirmed health tracking records.
servers:
  - url: https://fit-sheet-coach-gpt.vercel.app
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health
      security: []
      responses:
        "200":
          description: API is healthy
  /api/profile/metrics:
    post:
      operationId: saveProfileMetrics
      summary: Save user profile metrics for BMR and TDEE calculations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileMetricsInput"
      responses:
        "201":
          description: Saved profile metrics with calculated targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileMetricsResponse"
  /api/coach/analyze:
    post:
      operationId: analyzeCoachInput
      summary: Analyze user text or image input for coach review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachAnalyzeRequest"
      responses:
        "200":
          description: Coach analysis response with candidates or follow-up guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachAnalyzeResponse"
  /api/coach/confirm:
    post:
      operationId: confirmCoachCandidate
      summary: Confirm and persist one AI-proposed coach candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachConfirmRequest"
      responses:
        "201":
          description: Confirmed candidate saved through existing storage services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfirmResponse"
  /api/logs/food:
    post:
      operationId: logFood
      summary: Log food intake
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodLogInput"
      responses:
        "201":
          description: Saved normalized food log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodLogResponse"
  /api/logs/exercise:
    post:
      operationId: logExercise
      summary: Log exercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseLogInput"
      responses:
        "201":
          description: Saved normalized exercise log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseLogResponse"
  /api/logs/weight:
    post:
      operationId: logWeight
      summary: Log body weight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightLogInput"
      responses:
        "201":
          description: Saved weight log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightLogResponse"
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Get daily dashboard summary
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ProfileMetricsInput:
      type: object
      required: [userId, sex, age, heightCm, weightKg, activityLevel]
      properties:
        userId:
          type: string
        sex:
          type: string
          enum: [male, female]
        age:
          type: integer
          minimum: 10
          maximum: 120
        heightCm:
          type: number
          minimum: 1
        weightKg:
          type: number
          minimum: 1
        activityLevel:
          type: string
          enum: [sedentary, light, moderate, active, very_active]
        goal:
          type: string
          enum: [lose_fat, maintain, gain_muscle]
        loggedAt:
          type: string
          format: date-time
    FoodLogInput:
      type: object
      required: [userId, name]
      properties:
        userId:
          type: string
        name:
          type: string
        quantity:
          type: string
        calories:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        loggedAt:
          type: string
          format: date-time
    ExerciseLogInput:
      type: object
      required: [userId, name, durationMinutes]
      properties:
        userId:
          type: string
        name:
          type: string
        durationMinutes:
          type: number
          minimum: 1
        caloriesBurned:
          type: number
          minimum: 0
        intensity:
          type: string
          enum: [low, moderate, high]
        loggedAt:
          type: string
          format: date-time
    WeightLogInput:
      type: object
      required: [userId, weightKg]
      properties:
        userId:
          type: string
        weightKg:
          type: number
          minimum: 1
        loggedAt:
          type: string
          format: date-time
    CoachImageInput:
      type: object
      required: [mimeType]
      properties:
        mimeType:
          type: string
        dataUrl:
          type: string
        url:
          type: string
          format: uri
        altText:
          type: string
    CoachAnalyzeRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        message:
          type: string
        image:
          $ref: "#/components/schemas/CoachImageInput"
        contextDate:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Either message or image must be supplied.
    CoachCandidate:
      oneOf:
        - type: object
          required: [type, data]
          properties:
            type:
              const: profile
            data:
              $ref: "#/components/schemas/ProfileMetricsInput"
            confidence:
              type: number
              minimum: 0
              maximum: 1
            assumptions:
              type: array
              items:
                type: string
        - type: object
          required: [type, data]
          properties:
            type:
              const: food
            data:
              $ref: "#/components/schemas/FoodLogInput"
            confidence:
              type: number
              minimum: 0
              maximum: 1
            assumptions:
              type: array
              items:
                type: string
        - type: object
          required: [type, data]
          properties:
            type:
              const: exercise
            data:
              $ref: "#/components/schemas/ExerciseLogInput"
            confidence:
              type: number
              minimum: 0
              maximum: 1
            assumptions:
              type: array
              items:
                type: string
        - type: object
          required: [type, data]
          properties:
            type:
              const: weight
            data:
              $ref: "#/components/schemas/WeightLogInput"
            confidence:
              type: number
              minimum: 0
              maximum: 1
            assumptions:
              type: array
              items:
                type: string
    CoachAnalyzeResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            coachingMessage:
              type: string
            candidates:
              type: array
              items:
                $ref: "#/components/schemas/CoachCandidate"
            confidence:
              type: string
              enum: [low, medium, high, needs_follow_up]
            assumptions:
              type: array
              items:
                type: string
            needsConfirmation:
              type: boolean
    CoachConfirmRequest:
      type: object
      required: [userId, candidate, confirm]
      properties:
        userId:
          type: string
        candidate:
          $ref: "#/components/schemas/CoachCandidate"
        edits:
          type: object
          additionalProperties: true
        confirm:
          const: true
    CoachConfirmResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            coachingMessage:
              type: string
            saved:
              oneOf:
                - $ref: "#/components/schemas/ProfileMetricsInput"
                - $ref: "#/components/schemas/FoodLogInput"
                - $ref: "#/components/schemas/ExerciseLogInput"
                - $ref: "#/components/schemas/WeightLogInput"
    DashboardSummaryResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            userId:
              type: string
            date:
              type: string
            totals:
              type: object
            latestWeightKg:
              type: number
            bmr:
              type: number
            tdee:
              type: number
            calorieTarget:
              type: number
            recommendation:
              type: string
    ProfileMetricsResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          type: object
          properties:
            profile:
              allOf:
                - $ref: "#/components/schemas/ProfileMetricsInput"
                - type: object
                  properties:
                    loggedAt:
                      type: string
                      format: date-time
            bmr:
              type: number
            tdee:
              type: number
            calorieTarget:
              type: number
    FoodLogResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          allOf:
            - $ref: "#/components/schemas/FoodLogInput"
            - type: object
              properties:
                calories:
                  type: number
                  description: Provided calories or calories estimated from macros.
                loggedAt:
                  type: string
                  format: date-time
    ExerciseLogResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          allOf:
            - $ref: "#/components/schemas/ExerciseLogInput"
            - type: object
              properties:
                caloriesBurned:
                  type: number
                  description: Provided calories or calories estimated from duration and intensity.
                loggedAt:
                  type: string
                  format: date-time
    WeightLogResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          allOf:
            - $ref: "#/components/schemas/WeightLogInput"
            - type: object
              properties:
                loggedAt:
                  type: string
                  format: date-time
