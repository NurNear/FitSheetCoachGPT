openapi: 3.1.0
info:
  title: FitSheet Coach API
  version: 0.4.0
  description: Full backend contract for owner-bound, confirm-before-save health tracking and detailed reports.
servers:
  - url: https://fit-sheet-coach-gpt.vercel.app
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health
      security: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              example:
                ok: true
                data:
                  service: fitsheet-coach-gpt
                  status: healthy
  /api/profile/metrics:
    post:
      operationId: saveProfileMetrics
      summary: Save profile metrics and calculate fitness targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileMetricsInput"
      responses:
        "201":
          description: Saved profile metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileMetricsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/logs/food:
    get:
      operationId: getDailyFoodLogs
      summary: Read confirmed food logs for one day
      parameters:
        - name: userId
          in: query
          required: true
          description: Must equal the configured owner user ID when owner binding is enabled.
          schema:
            type: string
            minLength: 1
        - name: date
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Confirmed food logs for the requested day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFoodLogsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: logFood
      summary: Save a normalized food log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodLogInput"
      responses:
        "201":
          description: Saved food log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodLogResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/logs/exercise:
    post:
      operationId: logExercise
      summary: Save a normalized exercise log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseLogInput"
      responses:
        "201":
          description: Saved exercise log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseLogResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/logs/weight:
    post:
      operationId: logWeight
      summary: Save a weight log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightLogInput"
      responses:
        "201":
          description: Saved weight log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightLogResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coach/confirm:
    post:
      operationId: confirmCoachCandidate
      summary: Confirm and persist one Custom GPT-proposed candidate
      description: Call only after the user explicitly confirms the displayed candidate.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachConfirmRequest"
            example:
              userId: demo
              candidate:
                type: food
                data:
                  userId: demo
                  name: Chicken rice
                  quantity: 1 plate
                  calories: 488
                  proteinG: 35
                  carbsG: 60
                  fatG: 12
                  mealType: lunch
                confidence: 0.82
                assumptions:
                  - Portion size was estimated from the submitted image.
              confirm: true
      responses:
        "201":
          description: Confirmed candidate saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfirmResponse"
              example:
                ok: true
                data:
                  coachingMessage: Food log saved after confirmation.
                  saved:
                    userId: demo
                    name: Chicken rice
                    quantity: 1 plate
                    calories: 488
                    proteinG: 35
                    carbsG: 60
                    fatG: 12
                    mealType: lunch
                    loggedAt: "2026-06-10T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Get a daily dashboard summary
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: date
          in: query
          required: false
          description: UTC calendar date. Defaults to the current UTC date.
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Daily dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coach/behavior:
    get:
      operationId: getBehaviorInsights
      summary: Get structured insights from the last seven days of stored records
      description: Missing days are reported as missing coverage and are not treated as zero intake or missed exercise.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: endDate
          in: query
          required: false
          description: Inclusive UTC end date. Defaults to the current UTC date.
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Seven-day structured behavior insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorInsightsResponse"
              example:
                ok: true
                data:
                  userId: demo
                  period:
                    startDate: "2026-06-04"
                    endDate: "2026-06-10"
                    days: 7
                  coverage:
                    anyLoggedDays: 5
                    foodLoggedDays: 4
                    calorieCompleteDays: 3
                    proteinCompleteDays: 3
                    exerciseLoggedDays: 3
                    weightEntries: 2
                  insights:
                    - type: weight_trend
                      status: neutral
                      metrics:
                        firstWeightKg: 75
                        latestWeightKg: 74.5
                        deltaKg: -0.5
                        direction: decreasing
                        weightEntries: 2
                      evidence:
                        - date: "2026-06-04"
                          value: 75
                          unit: kg
                        - date: "2026-06-10"
                          value: 74.5
                          unit: kg
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coach/summary:
    get:
      operationId: getCoachSummary
      summary: Get a detailed health report for today, a date range, or all records since the first weight
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [today, range, all]
        - name: date
          in: query
          required: false
          description: Explicit user-local calendar date for scope=today or the current end date for scope=all.
          schema:
            $ref: "#/components/schemas/IsoDate"
        - name: startDate
          in: query
          required: false
          description: Inclusive start date. Required for scope=range.
          schema:
            $ref: "#/components/schemas/IsoDate"
        - name: endDate
          in: query
          required: false
          description: Inclusive end date. Required for scope=range.
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Detailed report with itemized food, exercise, weight, totals, coverage, and analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachSummaryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    UserId:
      name: userId
      in: query
      required: true
      description: Must equal the configured OWNER_USER_ID when owner binding is enabled.
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            error: ValidationError
            message: Candidate userId must match the confirmation userId.
    Unauthorized:
      description: API key is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            error: Unauthorized
    Forbidden:
      description: The request targets a user other than OWNER_USER_ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            ok: false
            error: Forbidden
            message: The requested userId is not allowed.
  schemas:
    IsoDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      example: "2026-06-10"
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ProfileMetricsInput:
      type: object
      required: [userId, sex, age, heightCm, weightKg, activityLevel]
      additionalProperties: false
      properties:
        userId:
          type: string
          minLength: 1
        sex:
          type: string
          enum: [male, female]
        age:
          type: integer
          minimum: 10
          maximum: 120
        heightCm:
          type: number
          exclusiveMinimum: 0
          maximum: 260
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        activityLevel:
          type: string
          enum: [sedentary, light, moderate, active, very_active]
        goal:
          type: string
          enum: [lose_fat, maintain, gain_muscle]
        loggedAt:
          type: string
          format: date-time
    FoodLogInput:
      type: object
      required: [userId, name]
      additionalProperties: false
      properties:
        userId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        quantity:
          type: string
        calories:
          type: number
          minimum: 0
          description: Total kcal supplied by the client. Custom GPT food candidates should include an explicit or estimated value.
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        loggedAt:
          type: string
          format: date-time
    ExerciseLogInput:
      type: object
      required: [userId, name, durationMinutes]
      additionalProperties: false
      properties:
        userId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        durationMinutes:
          type: number
          exclusiveMinimum: 0
          maximum: 1440
        caloriesBurned:
          type: number
          minimum: 0
        intensity:
          type: string
          enum: [low, moderate, high]
        loggedAt:
          type: string
          format: date-time
    WeightLogInput:
      type: object
      required: [userId, weightKg]
      additionalProperties: false
      properties:
        userId:
          type: string
          minLength: 1
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        loggedAt:
          type: string
          format: date-time
    CoachCandidate:
      oneOf:
        - $ref: "#/components/schemas/ProfileCandidate"
        - $ref: "#/components/schemas/FoodCandidate"
        - $ref: "#/components/schemas/ExerciseCandidate"
        - $ref: "#/components/schemas/WeightCandidate"
    CandidateMetadata:
      type: object
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
        assumptions:
          type: array
          items:
            type: string
    ProfileCandidate:
      allOf:
        - $ref: "#/components/schemas/CandidateMetadata"
        - type: object
          required: [type, data]
          properties:
            type:
              const: profile
            data:
              $ref: "#/components/schemas/ProfileMetricsInput"
    FoodCandidate:
      allOf:
        - $ref: "#/components/schemas/CandidateMetadata"
        - type: object
          required: [type, data]
          properties:
            type:
              const: food
            data:
              $ref: "#/components/schemas/FoodLogInput"
    ExerciseCandidate:
      allOf:
        - $ref: "#/components/schemas/CandidateMetadata"
        - type: object
          required: [type, data]
          properties:
            type:
              const: exercise
            data:
              $ref: "#/components/schemas/ExerciseLogInput"
    WeightCandidate:
      allOf:
        - $ref: "#/components/schemas/CandidateMetadata"
        - type: object
          required: [type, data]
          properties:
            type:
              const: weight
            data:
              $ref: "#/components/schemas/WeightLogInput"
    CoachConfirmRequest:
      type: object
      required: [userId, candidate, confirm]
      additionalProperties: false
      properties:
        userId:
          type: string
          minLength: 1
        candidate:
          $ref: "#/components/schemas/CoachCandidate"
        edits:
          type: object
          description: Optional correction metadata. Final corrected values belong in candidate.data.
          additionalProperties: true
        confirm:
          const: true
    CoachConfirmResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [coachingMessage, saved]
          properties:
            coachingMessage:
              type: string
            saved:
              oneOf:
                - $ref: "#/components/schemas/ProfileMetricsInput"
                - $ref: "#/components/schemas/FoodLogInput"
                - $ref: "#/components/schemas/ExerciseLogInput"
                - $ref: "#/components/schemas/WeightLogInput"
    DashboardSummaryResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, date, totals, recommendation]
          properties:
            userId:
              type: string
            date:
              $ref: "#/components/schemas/IsoDate"
            totals:
              type: object
              required: [caloriesIn, caloriesOut, proteinG, carbsG, fatG]
              properties:
                caloriesIn:
                  type: number
                caloriesOut:
                  type: number
                proteinG:
                  type: number
                carbsG:
                  type: number
                fatG:
                  type: number
            latestWeightKg:
              type: number
            bmr:
              type: number
            tdee:
              type: number
            calorieTarget:
              type: number
            recommendation:
              type: string
    CoachSummaryResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, period, coverage, totals, averages, weight, days, analysis]
          properties:
            userId:
              type: string
            period:
              $ref: "#/components/schemas/CoachSummaryPeriod"
            coverage:
              $ref: "#/components/schemas/CoachSummaryCoverage"
            totals:
              $ref: "#/components/schemas/CoachSummaryTotals"
            averages:
              $ref: "#/components/schemas/CoachSummaryAverages"
            weight:
              $ref: "#/components/schemas/CoachSummaryWeight"
            days:
              type: array
              items:
                $ref: "#/components/schemas/CoachSummaryDay"
            analysis:
              type: array
              items:
                $ref: "#/components/schemas/CoachSummaryAnalysis"
    CoachSummaryPeriod:
      type: object
      required: [scope, startDate, endDate, calendarDays]
      properties:
        scope:
          type: string
          enum: [today, range, all]
        startDate:
          $ref: "#/components/schemas/IsoDate"
        endDate:
          $ref: "#/components/schemas/IsoDate"
        calendarDays:
          type: integer
    CoachSummaryCoverage:
      type: object
      required: [recordedDays, foodLoggedDays, calorieCompleteDays, exerciseLoggedDays, weightEntries]
      properties:
        recordedDays:
          type: integer
        foodLoggedDays:
          type: integer
        calorieCompleteDays:
          type: integer
        exerciseLoggedDays:
          type: integer
        weightEntries:
          type: integer
    CoachSummaryTotals:
      type: object
      required: [caloriesIn, caloriesOut, proteinG, carbsG, fatG, exerciseMinutes]
      properties:
        caloriesIn:
          type: number
        caloriesOut:
          type: number
        proteinG:
          type: number
        carbsG:
          type: number
        fatG:
          type: number
        exerciseMinutes:
          type: number
    CoachSummaryAverages:
      type: object
      properties:
        caloriesInPerFoodLoggedDay:
          type: number
        exerciseMinutesPerExerciseDay:
          type: number
    CoachSummaryWeight:
      type: object
      properties:
        firstInPeriod:
          $ref: "#/components/schemas/WeightLogInput"
        latestInPeriod:
          $ref: "#/components/schemas/WeightLogInput"
        latestKnown:
          $ref: "#/components/schemas/WeightLogInput"
        deltaKg:
          type: number
    CoachSummaryDay:
      type: object
      required: [date, foods, exercises, weights, totals]
      properties:
        date:
          $ref: "#/components/schemas/IsoDate"
        foods:
          type: array
          items:
            $ref: "#/components/schemas/FoodLogInput"
        exercises:
          type: array
          items:
            $ref: "#/components/schemas/ExerciseLogInput"
        weights:
          type: array
          items:
            $ref: "#/components/schemas/WeightLogInput"
        totals:
          $ref: "#/components/schemas/CoachSummaryTotals"
    CoachSummaryAnalysis:
      type: object
      required: [type, status, summary, metrics]
      properties:
        type:
          type: string
          enum: [calorie_balance, exercise, weight_trend, logging_coverage]
        status:
          type: string
          enum: [on_track, attention, neutral, insufficient_data]
        summary:
          type: string
        metrics:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
    BehaviorInsightsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, period, coverage, insights]
          properties:
            userId:
              type: string
            period:
              type: object
              required: [startDate, endDate, days]
              properties:
                startDate:
                  $ref: "#/components/schemas/IsoDate"
                endDate:
                  $ref: "#/components/schemas/IsoDate"
                days:
                  const: 7
            coverage:
              $ref: "#/components/schemas/BehaviorCoverage"
            insights:
              type: array
              items:
                $ref: "#/components/schemas/BehaviorInsight"
    BehaviorCoverage:
      type: object
      required:
        - anyLoggedDays
        - foodLoggedDays
        - calorieCompleteDays
        - proteinCompleteDays
        - exerciseLoggedDays
        - weightEntries
      properties:
        anyLoggedDays:
          type: integer
        foodLoggedDays:
          type: integer
        calorieCompleteDays:
          type: integer
        proteinCompleteDays:
          type: integer
        exerciseLoggedDays:
          type: integer
        weightEntries:
          type: integer
    BehaviorInsight:
      type: object
      required: [type, status, metrics, evidence]
      properties:
        type:
          type: string
          enum:
            - protein_consistency
            - calorie_balance
            - exercise_frequency
            - weight_trend
            - logging_completeness
        status:
          type: string
          enum: [on_track, attention, neutral, insufficient_data]
        metrics:
          type: object
          additionalProperties:
            oneOf:
              - type: number
              - type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/BehaviorEvidence"
    BehaviorEvidence:
      type: object
      required: [date, value]
      properties:
        date:
          $ref: "#/components/schemas/IsoDate"
        value:
          oneOf:
            - type: number
            - type: string
        unit:
          type: string
        note:
          type: string
    ProfileMetricsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [profile, bmr, tdee, calorieTarget]
          properties:
            profile:
              $ref: "#/components/schemas/ProfileMetricsInput"
            bmr:
              type: number
            tdee:
              type: number
            calorieTarget:
              type: number
    FoodLogResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/FoodLogInput"
    DailyFoodLogsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, date, foods]
          properties:
            userId:
              type: string
            date:
              $ref: "#/components/schemas/IsoDate"
            foods:
              type: array
              items:
                $ref: "#/components/schemas/FoodLogInput"
    ExerciseLogResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/ExerciseLogInput"
    WeightLogResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          $ref: "#/components/schemas/WeightLogInput"
