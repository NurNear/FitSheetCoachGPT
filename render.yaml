services:
  - type: web
    name: fitsheet-coach-gpt
    runtime: node
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: json
      - key: DATA_FILE_PATH
        value: /var/data/fitsheet.json
      - key: API_KEY
        sync: false
    disk:
      name: fitsheet-data
      mountPath: /var/data
      sizeGB: 5
