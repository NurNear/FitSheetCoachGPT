openapi: 3.1.0
info:
  title: FitSheet Coach GPT Actions
  version: 0.3.0
  description: Owner-bound actions for confirmed health-log persistence and read-only summaries.
servers:
  - url: https://fit-sheet-coach-gpt.vercel.app
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the FitSheet Coach API is available
      security: []
      responses:
        "200":
          description: API is healthy
  /api/coach/confirm:
    post:
      operationId: confirmCoachCandidate
      summary: Save one candidate after explicit user confirmation
      description: Never call during analysis or review. Call only after the user confirms this exact candidate.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachConfirmRequest"
      responses:
        "201":
          description: Candidate saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachConfirmResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: Read a daily health summary
      parameters:
        - name: userId
          in: query
          required: true
          description: Must equal the owner user ID configured for this GPT.
          schema:
            type: string
            minLength: 1
        - name: date
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Daily summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/logs/food:
    get:
      operationId: getDailyFoodLogs
      summary: Read confirmed food items for one day
      description: Use this action when the user asks what foods or meals were logged. Do not substitute dashboard totals for item details.
      parameters:
        - name: userId
          in: query
          required: true
          description: Must equal the owner user ID configured for this GPT.
          schema:
            type: string
            minLength: 1
        - name: date
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Confirmed food items for the requested day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFoodLogsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/coach/behavior:
    get:
      operationId: getBehaviorInsights
      summary: Read structured insights from seven days of confirmed records
      description: Treat missing coverage as unknown. Do not describe missing days as zero intake or missed exercise.
      parameters:
        - name: userId
          in: query
          required: true
          description: Must equal the owner user ID configured for this GPT.
          schema:
            type: string
            minLength: 1
        - name: endDate
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IsoDate"
      responses:
        "200":
          description: Seven-day insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorInsightsResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    ValidationError:
      description: Invalid request or candidate
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The userId does not match the configured owner
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    IsoDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          const: false
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ProfileInput:
      type: object
      required: [userId, sex, age, heightCm, weightKg, activityLevel]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Use the exact owner user ID specified in the GPT instructions.
        sex:
          type: string
          enum: [male, female]
        age:
          type: integer
          minimum: 10
          maximum: 120
        heightCm:
          type: number
          exclusiveMinimum: 0
          maximum: 260
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        activityLevel:
          type: string
          enum: [sedentary, light, moderate, active, very_active]
        goal:
          type: string
          enum: [lose_fat, maintain, gain_muscle]
        loggedAt:
          type: string
          format: date-time
    FoodInput:
      type: object
      required: [userId, name, calories]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Use the exact owner user ID specified in the GPT instructions.
        name:
          type: string
        quantity:
          type: string
        calories:
          type: number
          minimum: 0
          description: Total kcal explicitly provided by the user or estimated by the GPT from the food description or image before confirmation.
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        loggedAt:
          type: string
          format: date-time
    FoodRecord:
      type: object
      required: [userId, name, loggedAt]
      additionalProperties: false
      properties:
        userId:
          type: string
        name:
          type: string
        quantity:
          type: string
        calories:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        mealType:
          type: string
          enum: [breakfast, lunch, dinner, snack]
        loggedAt:
          type: string
          format: date-time
    ExerciseInput:
      type: object
      required: [userId, name, durationMinutes]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Use the exact owner user ID specified in the GPT instructions.
        name:
          type: string
        durationMinutes:
          type: number
          exclusiveMinimum: 0
          maximum: 1440
        caloriesBurned:
          type: number
          minimum: 0
        intensity:
          type: string
          enum: [low, moderate, high]
        loggedAt:
          type: string
          format: date-time
    WeightInput:
      type: object
      required: [userId, weightKg]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Use the exact owner user ID specified in the GPT instructions.
        weightKg:
          type: number
          exclusiveMinimum: 0
          maximum: 500
        loggedAt:
          type: string
          format: date-time
    CandidateMetadata:
      type: object
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
        assumptions:
          type: array
          items:
            type: string
    CoachCandidate:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/CandidateMetadata"
            - type: object
              required: [type, data]
              properties:
                type:
                  const: profile
                data:
                  $ref: "#/components/schemas/ProfileInput"
        - allOf:
            - $ref: "#/components/schemas/CandidateMetadata"
            - type: object
              required: [type, data]
              properties:
                type:
                  const: food
                data:
                  $ref: "#/components/schemas/FoodInput"
        - allOf:
            - $ref: "#/components/schemas/CandidateMetadata"
            - type: object
              required: [type, data]
              properties:
                type:
                  const: exercise
                data:
                  $ref: "#/components/schemas/ExerciseInput"
        - allOf:
            - $ref: "#/components/schemas/CandidateMetadata"
            - type: object
              required: [type, data]
              properties:
                type:
                  const: weight
                data:
                  $ref: "#/components/schemas/WeightInput"
    CoachConfirmRequest:
      type: object
      required: [userId, candidate, confirm]
      additionalProperties: false
      properties:
        userId:
          type: string
          description: Use the exact owner user ID specified in the GPT instructions.
        candidate:
          $ref: "#/components/schemas/CoachCandidate"
        edits:
          type: object
          description: Optional correction metadata. Put final corrected values in candidate.data.
          additionalProperties: true
        confirm:
          const: true
    CoachConfirmResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [coachingMessage, saved]
          properties:
            coachingMessage:
              type: string
            saved:
              oneOf:
                - $ref: "#/components/schemas/ProfileInput"
                - $ref: "#/components/schemas/FoodInput"
                - $ref: "#/components/schemas/ExerciseInput"
                - $ref: "#/components/schemas/WeightInput"
    DashboardSummaryResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, date, totals, recommendation]
          properties:
            userId:
              type: string
            date:
              $ref: "#/components/schemas/IsoDate"
            totals:
              type: object
              required: [caloriesIn, caloriesOut, proteinG, carbsG, fatG]
              properties:
                caloriesIn:
                  type: number
                caloriesOut:
                  type: number
                proteinG:
                  type: number
                carbsG:
                  type: number
                fatG:
                  type: number
            latestWeightKg:
              type: number
            bmr:
              type: number
            tdee:
              type: number
            calorieTarget:
              type: number
            recommendation:
              type: string
    DailyFoodLogsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, date, foods]
          properties:
            userId:
              type: string
            date:
              $ref: "#/components/schemas/IsoDate"
            foods:
              type: array
              items:
                $ref: "#/components/schemas/FoodRecord"
    BehaviorInsightsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          const: true
        data:
          type: object
          required: [userId, period, coverage, insights]
          properties:
            userId:
              type: string
            period:
              type: object
              required: [startDate, endDate, days]
              properties:
                startDate:
                  $ref: "#/components/schemas/IsoDate"
                endDate:
                  $ref: "#/components/schemas/IsoDate"
                days:
                  const: 7
            coverage:
              type: object
              additionalProperties:
                type: integer
            insights:
              type: array
              items:
                type: object
                required: [type, status, metrics, evidence]
                properties:
                  type:
                    type: string
                    enum:
                      - protein_consistency
                      - calorie_balance
                      - exercise_frequency
                      - weight_trend
                      - logging_completeness
                  status:
                    type: string
                    enum: [on_track, attention, neutral, insufficient_data]
                  metrics:
                    type: object
                    additionalProperties:
                      oneOf:
                        - type: number
                        - type: string
                  evidence:
                    type: array
                    items:
                      type: object
                      required: [date, value]
                      properties:
                        date:
                          $ref: "#/components/schemas/IsoDate"
                        value:
                          oneOf:
                            - type: number
                            - type: string
                        unit:
                          type: string
                        note:
                          type: string
